# pyproject.toml — project metadata + tool config for uv/pip/pytest/ruff/mypy/pylint.

[project]
name = "password-vault"
version = "1.0.0"
description = "Encrypted password manager (Argon2id + AES-256-GCM)"
requires-python = ">=3.13"  # needed for X | None type-hint syntax
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}

dependencies = [
    "argon2-cffi>=25.1.0",   # Argon2id KDF
    "cryptography>=48.0.0",  # AES-256-GCM
    "typer>=0.25.1",         # CLI framework
    "rich>=15.0.0",          # terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "mypy>=2.1.0",
    "pylint>=4.0.5",
    "yapf>=0.43.0,<1.0.0",
]


[project.scripts]
pv = "cellar.main:app"
password-vault = "cellar.main:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cellar"]


[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
exclude = [".git", ".venv", "__pycache__", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — unused imports, undefined names
    "W",    # pycodestyle warnings
    "B",    # bugbear — mutable default args etc
    "C4",   # comprehension cleanups
    "UP",   # pyupgrade — modernize syntax
    "SIM",  # simplify
]
ignore = ["E501"]  # line length handled by yapf


[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = [".venv", "venv", "tests"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true  # argon2-cffi ships no type stubs


[tool.pylint.main]
py-version = "3.13"
jobs = 4
persistent = true
ignore = ["venv", ".venv", "__pycache__", "build", "dist", ".git", "tests"]

[tool.pylint.messages_control]
disable = [
    "R0903",  # too-few-public-methods — small data classes are fine
    "C0103",  # invalid-name — short names like `kdf` are intentional
    "C0325",  # superfluous-parens — fights yapf formatting
]

[tool.pylint.design]
max-args = 8         # default 5 is too strict here
max-attributes = 10  # default 7 is too strict here

# vault.py carries heavy docstrings and exceeds the default 1000-line
# cap; raised rather than splitting the module artificially.
[tool.pylint.format]
max-module-lines = 1500


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"